# Branch enforcement configuration.
# Driven by config, not hardcoded. Edit this file to change policy.

# Protected branches: commits are blocked on these branches.
# Supports exact names and regex patterns.
PROTECTED_BRANCHES=(
    "main"
    "master"
    "develop"
    "release/.*"
    "hotfix/.*"
)

# Branch naming convention: all non-protected branches must match this pattern.
# Default: Conventional Branch format (type/description or type/description-id)
# Examples: feat/branch-enforcement, fix/login-bug, chore/update-deps
BRANCH_PATTERN="^(feat|fix|chore|docs|refactor|test|ci|build|perf|revert)/[a-z0-9][a-z0-9-]*$"

# Agent enforcement: when running as an AI agent, enforce stricter rules.
# 1 = enforce, 0 = skip
AGENT_ENFORCEMENT=1

# Agent branch prefix: agents must use this prefix in addition to the convention.
# Example: agent/feat/my-work
AGENT_PREFIX="agent"

# Block repeated commits on the same branch within a session.
# 1 = enforce (warn only), 0 = skip
BLOCK_REPEATED_COMMITS=1

# Maximum commits per branch before requiring a new branch.
MAX_COMMITS_PER_BRANCH=10
