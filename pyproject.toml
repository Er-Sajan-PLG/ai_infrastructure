[project]
name = "ai-infrastructure"
version = "0.0.1"
description = "An independent, evolving AI infrastructure laboratory: research, architecture knowledge, implementations, interoperability, and evaluation."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ai_infrastructure maintainers" }]

# Runtime dependencies are deliberately empty.
#
# Charter §20 lists "unnecessary dependencies" as something to avoid, and §3
# requires complexity to earn its place. The first capabilities
# (tool-registry, model-provider-abstraction) are specified to run on the
# standard library alone, so there is nothing to depend on yet.
#
# Adding a runtime dependency is a human review gate (charter §22,
# "Adding a major dependency"). Record it as an ADR first.
dependencies = []

[project.optional-dependencies]
# Development toolchain. Versions are pinned (see requirements-dev.txt) so that
# two sessions a year apart verify against the same checks.
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.7",
    "black==26.5.1",
    "mypy==2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catalog"]

# ---------------------------------------------------------------------------
# Testing
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "9.0"
# Capability tests live beside their entry (catalog/<cat>/<entry>/tests/), per
# charter §13. They MUST be collected: with testpaths limited to tests/, a
# capability could ship tests that never ran while every gate stayed green.
# That was a real hole — see docs/decisions/0004.
# integrations/ joins these for the same reason: the Phase 1 exit criterion
# requires an end-to-end composition to live there WITH its own tests, so a
# testpath that excludes it would let those tests never run. Sixth instance of
# the same class of hole (docs/decisions/0004 is the first).
testpaths = ["tests", "catalog", "integrations"]
# Keep the skeleton valid when catalog/ has no test files yet.
norecursedirs = [".venv", ".uv-cache", "study_pipeline"]
python_files = ["test_*.py"]
# addopts keeps the summary readable and fails on unknown markers.
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: takes more than a couple of seconds",
    "network: requires outbound network access (never run in CI by default)",
    "external: requires a real external service or model provider",
]
filterwarnings = ["error"]

[tool.coverage.run]
# Include catalog so capability tests actually contribute measurement.
source = ["catalog", "integrations", "scripts"]
branch = true

[tool.coverage.report]
show_missing = true
# No threshold is enforced yet: there is no implementation to measure. Set
# fail_under when the first catalog entry lands (charter §18).
skip_covered = false

# ---------------------------------------------------------------------------
# Linting and formatting
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["catalog", "scripts", "tests", "study_pipeline"]
# Explicit so that tooling behavior is intentional rather than incidental.
extend-exclude = [".venv", ".uv-cache", "study_pipeline/studied_repos"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import order)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins (shadowing builtins)
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez (naive datetimes are a correctness bug)
    "T20",  # flake8-print (no stray prints in library code)
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
    "S",    # flake8-bandit (basic security checks)
    "TID",  # flake8-tidy-imports
    "PIE",  # flake8-pie
    "RET",  # flake8-return
    "ARG",  # unused arguments
]
ignore = [
    # Long docstring/URL lines are a readability tradeoff we accept; the
    # formatter handles code line length.
    "E501",
    # Assertions in tests are the point of tests.
    "S101",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert deliberately hostile inputs. The /tmp paths below are forged
# attack payloads in injection-boundary tests, not temp-file handling.
"tests/**" = ["S101", "ARG", "T20", "S108"]
"catalog/**/tests/**" = ["S101", "ARG", "T20", "S108", "TID252", "INP001"]
"scripts/**" = ["T20"]  # CLI scripts legitimately print
# Catalog entries are standalone, importable capabilities (charter §31): a
# consumer adds catalog/<category>/ to sys.path and imports the package by name.
# Relative imports *inside* an entry are what make it relocatable and
# independent of how the repository happens to be laid out. Requiring absolute
# `catalog.tools.x.y` imports would couple every entry to this repo's structure.
"catalog/**" = ["T20", "TID252"]
# Examples exist to be read and run, so printing is their purpose, not a stray
# debug leftover. /tmp paths here are deliberate attack payloads in
# injection-boundary demonstrations, not temp-file handling.
"catalog/**/examples/**" = ["T20", "TID252", "S108", "INP001"]
# An integration is a composition of capabilities, and it must be as relocatable
# as they are (charter section 31): it imports its own modules relatively so it
# can be lifted out of this repository and still work. The same reasoning that
# permits relative imports inside a catalog entry applies here.
"integrations/**" = ["TID252"]

[tool.ruff.lint.isort]
known-first-party = ["catalog"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
# Ruff's formatter is deliberately NOT used. Black owns formatting; ruff owns
# linting. Two opinionated formatters that always agree add no coverage, only a
# second thing to configure. See ADR-0003.
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 88
target-version = ["py312"]

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
# Strict where it matters. The charter (§13) requires type-hinted Python;
# strict mode is what makes that requirement enforceable rather than aspirational.
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
# No `files` list: targets are passed by the Makefile. Naming directories here
# makes mypy fail with "no files in directory" whenever a category is empty,
# which is the normal state of a category that declares itself but has no
# entries yet (charter §4 honest-status rule).
exclude = ["^\\.venv/", "^\\.uv-cache/", "^study_pipeline/"]

[[tool.mypy.overrides]]
# Tests use fixtures and monkeypatching patterns that strict mode fights.
module = "tests.*"
disallow_untyped_decorators = false

# ---------------------------------------------------------------------------
# SAST — bandit (docs/decisions/0018)
# ---------------------------------------------------------------------------
#
# bandit runs IN ADDITION to ruff's "S" rules, not instead of them: they are
# not equivalent. ruff has not ported B614/B615, removed S320, and leaves
# S401-S403 preview-only (so they silently never fire); its maintainers call
# the gap deliberate.
#
# Measured on this repository: bandit reports 558 raw findings, of which 550
# are B101 (assert) inside tests. The remaining 8 are forged attack payloads
# and fake credentials in tests/examples that ASSERT those inputs are
# rejected -- a scanner cannot tell a forged secret from a real one.
#
# B101 is therefore skipped wholesale. This is a deliberate trade-off recorded
# as AR-001 in docs/risks/ACCEPTED_RISKS.md, not a silent suppression:
# bandit's per-plugin `skips` accept globs but do not reliably apply to nested
# test directories, and a rule that quietly does not do what it says is worse
# than one that plainly does not run. The Makefile additionally scopes bandit
# to production paths, which is what removes the remaining false positives.
[tool.bandit]
exclude_dirs = [".venv", ".uv-cache", "study_pipeline"]
skips = ["B101"]

# ---------------------------------------------------------------------------
# Structural checks — import-linter (charter §31, docs/decisions/0017)
# ---------------------------------------------------------------------------
#
# Charting entry independence with a real import GRAPH, not a per-file scan,
# is what makes transitive leakage detectable: `entry_a -> shared_helper ->
# entry_b` is invisible to an AST walk over entry_a's files. import-linter is
# a DEV dependency, so the zero-runtime-dependency property still holds.
#
# CONFIGURATION LOCATION IS LOAD-BEARING: import-linter reads `setup.cfg` and
# `.importlinter` as INI and only `pyproject.toml` as TOML. Putting this TOML
# block in a `.importlinter` file fails with the opaque error
# "section '' already exists". That mistake was made and diagnosed here.

[tool.importlinter]
root_packages = [
    "model_provider",
    "tool_registry",
    "execution_trace_recorder",
    "mcp_client",
    "react_agent_loop",
]
# Required by contract 3 below, which names `agent_loop_end_to_end` as a
# forbidden module. That package lives under integrations/ rather than in the
# root_packages list, so the graph builder must be told to follow imports out
# of the declared roots -- otherwise it cannot see the edge it is being asked
# to forbid, and the contract would silently pass by never being evaluated.
include_external_packages = true

# --- 1. Leaf entries stay mutually independent --------------------------
#
# Measured, not assumed: react_agent_loop -> {model_provider, tool_registry}
# and mcp_client -> tool_registry are the ONLY cross-entry edges, and all of
# them go through public interfaces. model_provider, tool_registry and
# execution_trace_recorder are leaves today. This contract is what keeps the
# leaves leaves.
[[tool.importlinter.contracts]]
name = "Independent entries stay independent (charter §31)"
type = "independence"
modules = [
    "model_provider",
    "tool_registry",
    "execution_trace_recorder",
]

# --- 2. Composing entries: no mutual entanglement -----------------------
#
# react_agent_loop and mcp_client legitimately compose other capabilities
# through their PUBLIC interfaces (`from tool_registry import ToolId`). The
# rule is that they must not reach past that interface into a submodule
# (`from tool_registry.registry import ToolRegistry`), which would couple the
# importer to a private layout decision the owner must stay free to change.
#
# WHY THIS IS `independence` AND NOT `forbidden`:
# A `forbidden` contract on submodule names does NOT express this rule, and
# fails on correct code. import-linter builds the real import GRAPH, so
# forbidding `tool_registry.registry` also flags the legitimate
# `from tool_registry import X`, because tool_registry's own `__init__`
# imports `.registry` internally and the graph walk follows that edge. The
# reported chain is real, but it is not a violation -- the caller did not
# reach in; the package did. This was reproduced here before the contract was
# changed, and the reproduction is why the contract reads as it does.
#
# The "no reaching into internals" half therefore remains a REVIEW rule,
# stated in CONTRIBUTING.md. Per charter §20 it is recorded as a known
# non-enforceable rule (AR-004) rather than silently dropped.
[[tool.importlinter.contracts]]
name = "react_agent_loop stays independent of mcp_client (charter §31)"
type = "independence"
modules = [
    "react_agent_loop",
    "mcp_client",
]

# --- 3. No entry may depend on an integration ---------------------------
#
# The dependency direction is one-way: an integration composes entries; an
# entry must never know an integration exists. This is the contract that keeps
# the catalog relocatable -- an entry that imported the end-to-end integration
# could not be lifted out of this repository and still work.
[[tool.importlinter.contracts]]
name = "Catalog entries never depend on an integration"
type = "forbidden"
source_modules = [
    "model_provider",
    "tool_registry",
    "execution_trace_recorder",
    "mcp_client",
    "react_agent_loop",
]
forbidden_modules = ["agent_loop_end_to_end"]