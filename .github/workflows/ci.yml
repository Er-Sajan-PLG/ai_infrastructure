# CI for ai_infrastructure.
#
# This workflow DELEGATES. Every gate is invoked as a `make` target rather than
# re-implemented inline, so a green pipeline means the same thing as a green
# local run. `tests/test_ci_parity.py` fails the build if this file and the
# Makefile ever disagree about which gates exist.
#
# Jobs are split for branch protection granularity: each job is a statically
# named check that can be required independently.
#
# Charter references: §4 (claims must match artifacts), §18 (testing),
# §20 (a rule with no check is a preference), §21 (definition of done),
# §28 (never weaken a check), §29 (pipeline is infrastructure too).

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Least privilege, stated explicitly rather than inherited.
permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # --- Build & smoke test -----------------------------------------------
  build:
    name: build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Create virtualenv and install pinned toolchain
        run: |
          uv venv --python 3.12
          uv pip install -r requirements-dev.txt
          uv pip install -e .

      - name: Smoke test the package
        run: |
          .venv/bin/python -m study_pipeline --version
          PYTHONPATH="catalog/memory:catalog/tools:catalog/models:catalog/agents:catalog/observability:catalog/protocols" \
            .venv/bin/python -c "from vector_store import VectorStore; print('vector_store OK')"
          PYTHONPATH="catalog/memory:catalog/tools:catalog/models:catalog/agents:catalog/observability:catalog/protocols" \
            .venv/bin/python -c "from tool_registry import ToolRegistry; print('tool_registry OK')"

  # --- Conventional commits (PRs only) ----------------------------------
  commits:
    name: conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          # Get all commits in the PR
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          COMMITS=$(git log --format=%s "$BASE_SHA".."$HEAD_SHA")
          echo "Checking commits:"
          echo "$COMMITS"
          echo "---"
          # Check each commit message
          FAILED=0
          while IFS= read -r msg; do
            if [ -z "$msg" ]; then continue; fi
            # Must start with type(scope): or type:
            if ! echo "$msg" | grep -qE '^(feat|fix|refactor|docs|style|test|chore|ci|perf|build)(\([a-z-]+\))?: .+'; then
              echo "INVALID: $msg"
              echo "Expected format: type(scope): description"
              echo "Types: feat, fix, refactor, docs, style, test, chore, ci, perf, build"
              FAILED=1
            fi
          done <<< "$COMMITS"
          if [ "$FAILED" = "1" ]; then
            echo "::error::One or more commits do not follow Conventional Commits."
            exit 1
          fi
          echo "All commits follow Conventional Commits."

  # --- Quality gates ----------------------------------------------------
  quality:
    name: quality gates
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Create virtualenv and install pinned toolchain
        run: |
          uv venv --python 3.12
          uv pip install -r requirements-dev.txt

      - name: Lint, types, catalog contract, structural checks, risks, tests
        run: make check-strict

      - name: Coverage floor
        run: make coverage

      - name: Deferred-work register
        run: make deferred

      - name: Governance drift (taxonomy vs artifacts)
        run: make status

      # --- Change-scoped coverage (pull requests only) -------------------
      - name: Diff coverage (changed lines)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          ALLOW_MISSING: ${{ contains(github.event.pull_request.labels.*.name, 'missing-coverage-ok') }}
          DIFF_COVER_BASE: origin/${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          if [ "$ALLOW_MISSING" = "true" ]; then
            echo "Label 'missing-coverage-ok' present: reporting without failing."
            DIFF_COVER_FAIL_UNDER=0 make diff-coverage
          else
            make diff-coverage
          fi

  # --- Security scans ---------------------------------------------------
  security:
    name: security scans
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Create virtualenv and install pinned toolchain
        run: |
          uv venv --python 3.12
          uv pip install -r requirements-dev.txt

      # --- Tools that are not Python packages ---------------------------
      - name: Install pinned non-Python tools
        env:
          GITLEAKS_VERSION: "8.30.1"
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" gitleaks

          curl -sSfL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" actionlint

      - name: Secret scan (gitleaks, full history)
        run: make secrets

      - name: SAST (ruff S + bandit)
        run: make sast

      - name: Dependency audit (pip-audit, PyPI + OSV)
        run: make sca

      - name: Licence allow-list
        run: make licenses

      - name: Workflow lint (actionlint + zizmor)
        run: make workflows

  # --- Terminal aggregator ------------------------------------------------
  required:
    name: required
    runs-on: ubuntu-latest
    if: always()
    needs: [build, commits, quality, security]
    steps:
      - name: Check that every required job succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "At least one required job failed." >&2
            exit 1
          fi
          if [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "At least one required job was cancelled." >&2
            exit 1
          fi
          echo "All required jobs succeeded."
